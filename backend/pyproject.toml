[project]
name = "ai-resume-assistant-backend"
version = "0.1.0"
description = "FastAPI Backend for AI-Powered Resume Optimization & Career Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",
    "bcrypt>=4.1.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.9",
    "spacy>=3.8.0",
    "sentence-transformers>=3.0.0",
    "google-genai>=0.1.0",
    "reportlab>=4.2.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "aiosqlite>=0.20.0",
    "en-core-web-sm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
