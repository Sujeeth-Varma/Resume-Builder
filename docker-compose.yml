services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resume_builder_db
    restart: always
    environment:
      POSTGRES_USER: resume_user
      POSTGRES_PASSWORD: resume_password
      POSTGRES_DB: resume_builder_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_user -d resume_builder_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
